function burst(x,y,n,cols,sp=2.5,life=30){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=Math.random()*sp+.5; S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life+Math.random()*20,c:cols[i%cols.length],g:.08}); } }
const RAINBOW=['#ff5060','#ffaa32','#ffeb46','#5adc6e','#50aaff','#be6eff'], CONF=['#ff5082','#ffdc3c','#50c8ff','#82eb6e','#c882ff','#ff9632'];
function pbox(){ const p=S.p; return [p.x-8,p.y-66,p.x+8,p.y-4]; }
function inBox(x,y,b,pad=0){ return x>b[0]-pad && x<b[2]+pad && y>b[1]-pad && y<b[3]+pad; }
function hurt(){ const p=S.p; if (p.inv>0 || S.cont>0) return; if (Math.random()<.6) bark('hero', pick(HERO_HURT), 90); if (S.fol.some(f=>f.k==='chow') && Math.random()<.35) S.bq = {who:'chow', s:'UTH JA '+N()+'! TU KAR SAKTI HAI!', t:60}; p.hp--; p.inv=100; SFX.hurt(); S.shake=7; p.vy=-4; if (p.hp<=0){ p.hp=5; p.inv=150; S.msg={s:'INFINITE LIVES!',t:90}; SFX.power(); burst(p.x,p.y-40,24,['#ff5082','#ffdc3c','#ffffff'],2.5,30); } }

function fire(){ const p=S.p; if (p.cd>0) return; p.cd = p.spread?11:9; SFX.shoot();
  let mx,my,ang;
  if (S.mode==='final'){ const b=S.boss, tx=b.x+85, ty=b.y+118; mx=p.x+p.face*25; my=p.y-73; ang=Math.atan2(ty-my,tx-mx); }
  else if (IN.up){ mx=p.x+p.face*25; my=p.y-73; ang = p.face>0 ? -1.0 : Math.PI+1.0; }
  else { mx=p.x+p.face*36; my=p.y-(p.ground?43:48); ang = p.face>0?0:Math.PI; }
  (p.spread?[-.16,0,.16]:[0]).forEach((da,i) => S.bullets.push({x:mx,y:my,vx:Math.cos(ang+da)*6.5,vy:Math.sin(ang+da)*6.5,c:p.spread?RAINBOW[(frame+i*2)%6]:'#ff6eaa',life:60}));
  S.parts.push({x:mx,y:my,vx:0,vy:0,life:4,c:'#ffffff',g:0,big:1}); }

function updatePlayer(){
  const p=S.p;
  if (S.cont>0){ if (--S.cont===0){ p.hp=5; p.inv=120; } return; }
  const sp=2.2; p.vx*=.7;
  if (IN.left){ p.vx=-sp; p.face=-1; } if (IN.right){ p.vx=sp; p.face=1; }
  if (S.mode==='final' && S.boss) { if (IN.fire) p.face = (S.boss.x+85 < p.x) ? -1 : 1; }
  if (pressed('jump')) p.buf = 9; if (p.buf>0) p.buf--;
  if (p.ground) p.coy = 9; else if (p.coy>0) p.coy--;
  if (p.buf>0 && p.coy>0){ p.vy=-10.2; p.ground=false; p.coy=0; p.buf=0; SFX.jump(); }
  const g = p.vy<0 ? (IN.jump ? .36 : .8) : .48; p.vy = Math.min(p.vy+g, 7.5);
  const oy=p.y; p.x+=p.vx; p.y+=p.vy;
  const lo = S.lock!==null ? S.lock+12 : (S.mode==='final' ? 12 : S.cam+12), hi = S.lock!==null ? S.lock+W-12 : (S.mode==='final' ? W-12 : 1e9);
  p.x = Math.max(lo, Math.min(hi, p.x)); p.ground=false;
  if (p.vy>=0){ const pl=platAt(p.x,oy,p.y);
    if (pl!==null){ p.y=pl; p.vy=0; p.ground=true; }
    else if (p.y>=GY && oy<=GY+2 && !overPit(p.x)){ p.y=GY; p.vy=0; p.ground=true; p.safe=p.x; } }
  if (p.y>VH+30){ const pit = WD().pits.find(([a,b]) => p.safe < a+4 && p.safe > a-120) || WD().pits.find(([a,b]) => Math.abs(p.safe-a)<140);
    p.x = pit ? pit[0]-20 : p.safe; p.y=GY; p.vy=0; p.inv=Math.max(p.inv,50); S.msg={s:'OOPS! TRY AGAIN!',t:70}; SFX.blip(); }
  if (IN.fire) fire(); if (p.cd>0) p.cd--; if (p.inv>0) p.inv--;
  p.anim += Math.abs(p.vx)>.5 ? 1 : 0;
  p.pose = !p.ground ? 'jump' : (IN.up || (S.mode==='final' && IN.fire)) ? 'up' : Math.abs(p.vx)>.5 ? ((p.anim>>3)%2?'run':'run2') : 'stand';
  S.hist.push({x:p.x,y:p.y,g:p.ground}); if (S.hist.length>120) S.hist.shift();
}

function updateFollowers(){
  const p=S.p; S.fol.forEach((f,i) => {
    if (S.lock!==null || S.mode==='final'){ const tx = (S.lock!==null ? S.lock : 0) + 18 + i*22; f.x += Math.max(-2.4,Math.min(2.4,tx-f.x)); f.y = GY; f.cheer = Math.abs(tx-f.x)<2; f.face=1; f.moving = Math.abs(tx-f.x)>=2; return; }
    f.cheer=false;
    const tx = p.x - p.face*(26*(i+1)); const dx = tx-f.x; f.moving = Math.abs(dx)>3; f.x += Math.max(-2.6,Math.min(2.6,dx*.15));
    if (f.moving) f.face = dx>0?1:-1; else f.face=p.face;
    const h = S.hist[Math.max(0,S.hist.length-1-12*(i+1))]; f.y = h ? h.y : GY; if (f.y > GY) f.y = GY;
    if (overPit(f.x)) f.y = Math.min(f.y, GY-26);
  });
}

function bossDef(){ return BOSSES[WD().boss]; }
function spawnBoss(){ const d=bossDef(); S.boss = {k:WD().boss, x:S.lock+(WD().cage.length?140:200), y:GY, vx:0, vy:0, hp:d.hp, max:d.hp, st:'idle', t:70, f:0, face:-1, cyc:0, frame2:false, dead:-1}; }
function bossBox(b){ const d=BOSSES[b.k]; return [b.x-d.hit[0], b.y-d.hit[1], b.x+d.hit[0], b.y]; }

function updateGroundBoss(){
  const b=S.boss, p=S.p, A=S.lock; if (b.f>0) b.f--;
  if (b.dead>=0){ b.dead++; if (b.dead%7===0){ const bb=bossBox(b); burst(bb[0]+Math.random()*(bb[2]-bb[0]), bb[1]+Math.random()*(bb[3]-bb[1]), 14, CONF, 3, 30); SFX.boom(); }
    if (b.dead>90){ S.boss=null; S.eb=[]; startDialog(lines(S.wi,'rescue'), () => afterRescue()); setMode('rescue'); playMusic('win'); SFX.cage(); } return; }
  if (b.st!=='pounce' && b.st!=='hop' && b.st!=='dash') b.face = p.x < b.x ? -1 : 1;
  b.t--; b.frame2=false;
  const k=b.k;
  if (k==='daruma'){
    if (b.st==='idle' && b.t<=0){ b.st = (b.cyc++%2===0) ? 'hop' : 'throw'; b.t = 40; if (b.st==='hop'){ b.vy=-8.5; b.vx = Math.max(-2.4,Math.min(2.4,(p.x-b.x)/45)); } }
    if (b.st==='hop'){ b.vy+=.32; b.x+=b.vx; b.y+=b.vy; if (b.y>=GY){ b.y=GY; b.vy=0; S.shake=6; SFX.boom(); b.st='idle'; b.t=60;
      [-1,1].forEach(dr => S.eb.push({x:b.x+dr*40,y:GY-6,vx:dr*2.6,vy:0,t:'wave',life:120})); } }
    if (b.st==='throw' && b.t===20){ for (let i=0;i<3;i++) S.eb.push({x:b.x, y:GY-80, vx:(p.x-b.x)/70 + (i-1)*.7, vy:-6-i*.6, t:'ball', g:.2, life:200}); SFX.blip(); }
    if (b.st==='throw' && b.t<=0){ b.st='idle'; b.t=60; }
  } else if (k==='mogambo'){
    if (b.st==='idle' && b.t<=0){ b.st = ['slash','pounce','yarn','slash'][b.cyc++%4]; b.t = b.st==='pounce' ? 46 : 40; b.tx = p.x; }
    if (b.st==='slash'){ b.frame2 = b.t>10; if (b.t===14){ S.eb.push({x:b.x+b.face*50, y:GY-14, vx:b.face*3.1, vy:0, t:'slash', life:140}); SFX.hurt(); } if (b.t<=0){ b.st='idle'; b.t=50; } }
    if (b.st==='pounce'){ if (b.t>0){ b.frame2 = b.t%10<5; } if (b.t===0){ b.vy=-9.5; b.vx=(b.tx-b.x)/50; b.air=true; }
      if (b.air){ b.vy+=.38; b.x+=b.vx; b.y+=b.vy; b.frame2=true; if (b.y>=GY){ b.y=GY; b.air=false; b.st='idle'; b.t=60; S.shake=6; SFX.boom(); } } }
    if (b.st==='yarn'){ if (b.t===20){ for (let i=0;i<2;i++) S.eb.push({x:b.x+b.face*40, y:GY-20, vx:b.face*(1.6+i*.9), vy:-4-i, t:'yarn', g:.25, bounce:1, life:260}); SFX.blip(); } if (b.t<=0){ b.st='idle'; b.t=55; } }
  } else if (k==='chef'){
    if (b.st==='idle' && b.t<=0){ b.st = ['shoot','shoot','dash'][b.cyc++%3]; b.t = b.st==='dash' ? 50 : 36; }
    if (b.st==='shoot'){ b.frame2 = b.t<24; if (b.t===18){ for (let i=0;i<3;i++) S.eb.push({x:b.x, y:GY-100, vx:b.face*(1.2+i*.9), vy:-4.5+i*.3, t:'mac', g:.18, life:220, c:['#ff96be','#ffd25a','#78c88c'][i]}); SFX.blip(); } if (b.t<=0){ b.st='idle'; b.t=45; } }
    if (b.st==='dash'){ if (b.t>0){ b.frame2 = true; b.shakeX = (Math.random()-.5)*3; } if (b.t===0){ b.vx = b.x > A+135 ? -3.4 : 3.4; }
      if (b.t<0){ b.x += b.vx; b.shakeX=0; if (b.x < A+50 || b.x > A+220){ b.x = Math.max(A+50, Math.min(A+220, b.x)); b.st='idle'; b.t=60; S.shake=5; SFX.boom(); } } }
  }
  const cgN = WD().cage.length, bmax = cgN ? A+W-8-(cgN>2?80:60)-BOSSES[b.k].w/2+4 : A+232; b.x = Math.max(A+40, Math.min(bmax, b.x));
  if (b.hp>0 && inBox(p.x, p.y-30, bossBox(b), 6)) hurt();
  if (b.hp<=0 && b.dead<0){ b.dead=0; S.eb=[]; S.bullets=[]; playMusic(null); SFX.boom(); S.shake=14; S.score+=3000; }
}

function updateFinal(){
  const B=S.boss, p=S.p; B.x = 50 + Math.sin(frame*.012)*34; B.y = Math.min(24, B.y+1.6); if (B.f>0) B.f--;
  if (B.dead>=0){ B.dead++; if (B.dead%6===0){ burst(B.x+20+Math.random()*130, B.y+30+Math.random()*130, 18, CONF, 3.5, 40); SFX.boom(); S.shake=6; }
    if (B.dead>130 && !S.downTalk){ S.downTalk=1; startDialog(lines(2,'finaldown'), () => { setMode('clear'); playMusic('win'); S.cake={x:135,y:-40,vy:0}; }); } return; }
  B.t--; B.open = B.t<25 && B.atk===0;
  if (B.t<=0){ if (B.atk===0){ const mx=B.x+85, my=B.y+118, a=Math.atan2(p.y-40-my, p.x-mx);
      for (const da of (B.hp<B.max/2?[-.25,0,.25]:[0])) S.eb.push({x:mx,y:my,vx:Math.cos(a+da)*2.5,vy:Math.sin(a+da)*2.5,t:'fire',life:300}); SFX.boom(); }
    else for (let i=0;i<3;i++){ const x = i===0 ? p.x : 20+Math.random()*230; S.eb.push({x, y:-10-i*40, vx:0, vy:1.2, t:'paper', life:400}); }
    B.atk=(B.atk+1)%2; B.t = B.hp<B.max/2 ? 72 : 96; }
  if (B.hp<=0){ B.dead=0; S.eb=[]; S.bullets=[]; playMusic(null); SFX.boom(); S.shake=20; S.score+=5000; }
}

function updateBullets(){
  S.bullets = S.bullets.filter(b => { b.x+=b.vx; b.y+=b.vy; b.life--;
    for (const e of S.en) if (e.alive && e.a){ const sp=IMG[WD().spr[e.t]]; const w=sp.width, h=sp.height;
      const box = [e.x-w/2+3, e.y-h+2, e.x+w/2-3, e.y];
      if (inBox(b.x,b.y,box)){ e.hp--; e.f=6; SFX.hit(); burst(b.x,b.y,5,[b.c,'#fff'],1.5,10);
        if (e.hp<=0){ e.alive=false; S.score+=e.t==='f'?250:100; SFX.boom(); burst(e.x,e.y-h/2,24,CONF,3,30); S.shake=3; if (Math.random()<.4) S.pick.push({t:'candy',x:e.x,y:e.y-30,alive:true,vy:-3}); }
        return false; } }
    const B=S.boss;
    if (B && B.dead<0 && B.hp>0){
      const box = S.mode==='final' ? [B.x+10,B.y+14,B.x+160,B.y+170] : bossBox(B);
      if (inBox(b.x,b.y,box)){ B.hp--; B.f=4; SFX.hit(); S.score+=20; burst(b.x,b.y,6,[b.c,'#fff'],1.8,10); return false; } }
    const L = S.mode==='final' ? 0 : (S.lock!==null ? S.lock : S.cam);
    return b.life>0 && b.y>-10 && b.y<VH && b.x>L-20 && b.x<L+W+20; });
}

function updateEnemies(){
  const p=S.p;
  for (const e of S.en){ if (!e.alive) continue; if (!e.a && e.x < S.cam+W+30) e.a=true; if (!e.a) continue; if (e.f>0) e.f--;
    const sp = IMG[WD().spr[e.t]], h = sp.height;
    if (e.t==='w'){ e.vx = p.x<e.x ? -.5 : .5; e.x+=e.vx; if (WD().pits.some(([a,b]) => e.x>a-4 && e.x<b+4)) e.x-=e.vx*2; e.bob=Math.abs(Math.sin(frame*.25+e.x))*2;
      if (inBox(e.x, e.y-h/2, pbox(), 8)) hurt(); }
    else if (e.t==='h'){ e.cd--; if (e.y>=GY && e.cd<=0){ e.vy=-6; e.vx=(p.x<e.x?-1:1)*1.1; e.cd=70; }
      if (e.y<GY || e.vy<0){ e.vy+=.3; e.x+=e.vx; e.y+=e.vy; if (e.y>=GY){ e.y=GY; e.vy=0; } }
      if (inBox(e.x, e.y-h/2, pbox(), 8)) hurt(); }
    else { e.x += Math.sign(p.x+30-e.x)*.55; e.y = e.by + Math.sin(frame*.05+e.x*.01)*12; e.cd--;
      if (e.cd<=0){ e.cd=85; S.eb.push({x:e.x, y:e.y+10, vx:0, vy:2.4, t:WD().drop, life:200}); }
      if (inBox(e.x, e.y-h/2, pbox(), 10)) hurt(); }
    if (e.x < S.cam-80) e.alive=false; }
  for (const k of S.pick){ if (!k.alive) continue;
    if (k.vy!==undefined){ k.vy+=.3; k.y+=k.vy; if (k.y>GY-12){ k.y=GY-12; k.vy=0; } }
    if (inBox(k.x, k.y, pbox(), 10)){ k.alive=false;
      if (k.t==='cupcake'){ p.spread=true; SFX.power(); S.msg={s:'RAINBOW GUN!',t:110}; bark('hero','RAINBOW POWER! AB AAYEGA MAZA!',120); burst(k.x,k.y,30,RAINBOW,3,30); S.score+=500; }
      else { SFX.coin(); S.score+=50; burst(k.x,k.y,6,['#ffdc46','#ff78b4'],1.5,14); if (S.score % 1000 < 50 && p.hp<5) { p.hp++; S.msg={s:'+1 HEART!',t:60}; } } } }
}

function updateEB(){
  S.eb = S.eb.filter(b => { b.life--; b.x+=b.vx; b.y+=b.vy; if (b.g) b.vy+=b.g; if (b.t==='paper') b.vy=Math.min(b.vy+.05,3.2);
    if (b.t==='yarn' && b.y>GY-8){ b.y=GY-8; b.vy = b.bounce-- > 0 ? -3.5 : 0; }
    const pad = b.t==='wave'||b.t==='slash' ? 6 : 4;
    if (inBox(b.x, b.y, pbox(), pad)){ hurt(); burst(b.x,b.y,8,['#fff','#ff9632'],1.5,12); return false; }
    if (b.t!=='wave' && b.t!=='slash' && b.t!=='yarn' && b.y>GY){ burst(b.x,GY,4,['#ffffff','#bbbbbb'],1,10); return false; }
    return b.life>0 && b.y<VH+20; });
}
function updateBarks(){
  S.barks = S.barks.filter(b => --b.t > 0);
  if (S.bq && --S.bq.t <= 0){ bark(S.bq.who, S.bq.s); S.bq = null; }
  const fighting = S.mode==='boss' || S.mode==='final';
  if (fighting){ const b = S.boss; if (!b || b.dead>=0) return; const k = S.mode==='final' ? 'monday' : b.k, T = TAUNT[k];
    if (!b.saidHalf && b.hp < b.max*.5){ b.saidHalf = 1; bark('boss', T.half, 200); return; }
    if (!b.saidLow && b.hp < b.max*.2){ b.saidLow = 1; bark('boss', T.low, 200); return; }
    if (--S.bt <= 0){ S.bt = 170; const r = Math.random();
      if (r < .45) bark('boss', pick(T.l));
      else if (r < .75 || !S.fol.length){ const s = pick(HERO_FIGHT); bark('hero', s); if (s==='HOW IS THE JOSH?' && S.fol.length) S.bq = {who:S.fol[S.fol.length-1].k, s:'HIGH, MA\'AM!', t:70}; }
      else { const f = pick(S.fol); bark(f.k, pick(CHEER[f.k])); } } }
  else if (S.mode==='level' && S.fol.length){ if (--S.bt <= 0){ S.bt = 520 + Math.random()*200; const opts = BANTER.filter(x => S.fol.some(f => f.k===x[0])); if (opts.length){ const [w,s,r] = pick(opts); bark(w, s); S.bq = {who:'hero', s:r, t:110}; } } }
}
function updateParts(){ S.parts = S.parts.filter(q => { q.x+=q.vx; q.y+=q.vy; q.vy+=q.g; q.life--; return q.life>0; }); }

/* ---------- update ---------- */
function update(){
  frame++; S.t++; readInput(); if (S.shake>.5) S.shake*=.85; if (S.fade>0) S.fade--;
  if (S.msg && --S.msg.t<=0) S.msg=null;
  const tapIn = (x0,y0,x1,y1) => taps.some(([x,y]) => x>=x0&&x<=x1&&y>=y0&&y<=y1);
  switch (S.mode){
    case 'title': if (S.t>20 && (advance() || taps.length)) { setMode('creator'); SFX.blip(); } break;
    case 'creator': {
      const rows = [['hair',HAIRS.length],['hc',4],['skin',4],['out',OUTF.length]];
      if (tapIn(146,46,268,78)) openName();
      rows.forEach(([k,n],i) => { const y=88+i*44; if (tapIn(146,y,184,y+34)) { HERO[k]=(HERO[k]+n-1)%n; SFX.blip(); } if (tapIn(230,y,268,y+34)) { HERO[k]=(HERO[k]+1)%n; SFX.blip(); } });
      if (tapIn(150,272,266,318) || (S.t>20 && pressed('jump'))) { nm.blur(); saveHero(); setMode('story'); S.panel=0; SFX.power(); }
    } break;
    case 'story': if (S.t>15 && advance()){ SFX.blip(); S.panel++; S.t=0; if (S.panel>=4){ setMode('rules'); } } break;
    case 'rules': if (S.t>20 && advance()){ SFX.blip(); startWorld(0); } break;
    case 'card': if (S.t>40 && (advance() || S.t>260)){ setMode('level'); playMusic(WD().music); } break;
    case 'level': {
      updatePlayer(); updateFollowers(); updateEnemies(); updateEB();
      S.cam += (Math.max(0, Math.min(WD().len-W+40, S.p.x-110)) - S.cam)*.12;
      if (S.p.x > WD().len+40){ S.lock = WD().len; S.cam = S.lock; S.en=[]; S.eb=[]; setMode('bossIntro'); spawnBoss(); playMusic(null); startDialog(lines(S.wi,'intro'), () => { setMode('boss'); playMusic('boss'); }); }
      const am = WD().amb; if (frame%7===0) S.parts.push(am==='petal' ? {x:S.cam+Math.random()*W+40,y:-4,vx:-.6,vy:.7,life:400,c:['#ffb6d2','#ff8cb4','#ffe0ec'][frame%3],g:0} : am==='sand' ? {x:S.cam+W+4,y:Math.random()*GY,vx:-1.6,vy:.1,life:200,c:'#f0d29a',g:0} : {x:S.cam+Math.random()*W,y:Math.random()*200,vx:0,vy:-.1,life:40,c:'#fff6c8',g:0});
    } break;
    case 'bossIntro': updateFollowers(); S.p.pose='stand'; tickDialog(); break;

function frameDraw(img, idx, fw, fh, x, y, flip=false, sc=1){ if (!img || !img.width) return; const w=fw*sc, h=fh*sc;

  else ctx.drawImage(img, idx*fw, 0, fw, fh, Math.round(x), Math.round(y), w, h); }
function spr(name, x, y, flip=false, sc=1){ const im=IMG[name]; if (!im||!im.width) return; frameDraw(im, 0, im.width, im.height, x, y, flip, sc); }
function tile(name, off, y){ const im=IMG[name]; if (!im||!im.width) return; let x = -((off%im.width)+im.width)%im.width; for (; x<W; x+=im.width) ctx.drawImage(im, Math.round(x), y); }
const whiteCache = {};
function white(name){ if (whiteCache[name]) return whiteCache[name]; const im=IMG[name]; const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0); g.globalCompositeOperation='source-in'; g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); whiteCache[name]=c; return c; }

    else if (lab==='HAIR COLOR'){ const c=DATA.hairs[HERO.hc][0]; ctx.fillStyle=`rgb(${c})`; ctx.fillRect(176,y+13,10,16); txt(val, 190, y+17, 1, '#ffffff'); }
    else { const vw = val.length*6; txt(val, 206-vw/2, y+17, 1, '#ffffff'); } });
  ctx.fillStyle='#160e28'; ctx.fillRect(150,274,116,44); ctx.fillStyle = (frame>>4)%2 ? '#ffc83c' : '#ffdc6e'; ctx.fillRect(152,272,112,42); ctx.fillStyle='#fff3b0'; ctx.fillRect(152,272,112,3);
  txt('START >', 166, 286, 2, '#ffffff', '#ffe6f0', '#a03c00');
}
function drawStory(){
  const pnl=S.panel; const g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,['#1a1040','#3a0a1a','#0a1a3a','#2a1650'][pnl]); g.addColorStop(1,'#0a0618'); ctx.fillStyle=g; ctx.fillRect(0,0,W,VH);
  for (let i=0;i<40;i++){ ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect((i*71)%W,(i*43)%200,1,1); }
  const T = [['IT IS '+N()+"'S","BIRTHDAY TODAY!"],['BUT THE VILLAINS','STOLE HER CAKE...'],['...AND CAPTURED','HER BEST FRIENDS!'],['TRAVEL THE WORLD,','SAVE THEM ALL &','GET THE CAKE BACK!']][pnl];
  T.forEach((l,i) => txt(l, 'c', 30+i*22, 2, i===0?'#fff078':'#ffffff', i===0?'#ff9628':'#ffd2e6'));
  if (pnl===0){ const st=heroStrip(); st && frameDraw(st,(frame>>4)%2?5:6,80,92,30,140,false,1.5); spr('cake',160,232,false,1.5);
    for (let i=0;i<6;i++){ ctx.fillStyle=CONF[i]; ctx.fillRect(140+((i*37+frame)%110), 120+((i*53+frame*1.5)%160), 2, 3); } }
  if (pnl===1){ ctx.drawImage(IMG.boss, 20, 120, 120, 124); spr('cake', 160+Math.sin(frame*.1)*4, 200, false, 1.5); txt('MINE!', 156, 176, 2, '#ff6464'); }
  if (pnl===2){ [['f_siddhay',-14],['f_chow',46],['f_sanvi',106]].forEach(([k,x]) => { frameDraw(IMG[k], 4, 80, 92, x, 150); drawCage(x+16, 248, 50, k==='f_sanvi'?70:96, 0); });
    frameDraw(IMG.f_tintin,0,44,38,200,206,true); drawCage(194,248,54,48,0); txt('HELP!', 'c', 140, 2, '#ffffff', '#ff8cbe'); }
  if (pnl===3){ [['JAPAN','#ff8cb4'],['EGYPT','#ffc85a'],['PARIS','#b48cff'],['CAKE!','#ff5082']].forEach(([n,c],i) => { const x=24+i*62, y=170+(i%2)*30;
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x+18,y,12,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillRect(x+16,y-2,4,4); txt(n, x+18-n.length*3, y+18, 1, '#ffffff');
      if (i<3){ ctx.fillStyle='#ffffff88'; for (let k=0;k<6;k++) ctx.fillRect(x+34+k*7, y+(i%2?-4:4)-k*((i%2)?-4:4)+((i%2)?-20:20)*0, 3, 2); } });
    const st=heroStrip(); st && frameDraw(st, (frame>>3)%2?1:2, 80, 92, 95, 220); }
  if ((frame>>4)%2) txt('TAP TO CONTINUE', 'c', 312, 1, '#ffc83c');
}
function drawRules(){
  ctx.fillStyle='#140a2a'; ctx.fillRect(0,0,W,VH); banner(8,314); txt('HOW TO PLAY','c',18,3,'#fff078','#ff9628');
  const L=[['< >','MOVE LEFT / RIGHT','#78dcff'],['UP','AIM YOUR BLASTER UP','#78dcff'],['A','JUMP  (HOLD = JUMP HIGHER)','#ff6e96'],['B','FIRE  (HOLD = KEEP FIRING)','#ffc83c'],
    ['CAKE','CUPCAKE = RAINBOW GUN','#ff8cbe'],['*','INFINITE LIVES! HEARTS','#ff5060'],['','REFILL, YOU NEVER LOSE','#ff5060'],['PIT','FALLING IS SAFE, NO DAMAGE','#82eb6e'],
    ['BOSS','BEAT EACH BOSS TO RESCUE','#ff9632'],['','A FRIEND. THEY JOIN YOU!','#ff9632']];
  L.forEach(([k,t,c],i) => { const y=56+i*22; if (k){ ctx.fillStyle=c; ctx.fillRect(18,y-3,34,15); txt(k, 35-k.length*3, y, 1, '#160e22', '#160e22', c); } txt(t, 60, y, 1, '#ffffff'); });
  spr('cupcake', 22, 138);
  if ((frame>>4)%2) txt('TAP TO BEGIN!', 'c', 290, 2, '#ffffff', '#ffd2e6'); }
function drawCard(){ const Wd=WD(); ctx.drawImage(IMG[Wd.id+'_sky'],0,0); tile(Wd.id+'_far', frame*.4, 0); tile(Wd.id+'_near', frame*.8, 0); tile(Wd.id+'_ground', frame*1.2, GY-4);
  ctx.fillStyle='rgba(10,6,24,.55)'; ctx.fillRect(0,0,W,VH);
  banner(40,130); txt('WORLD '+(S.wi+1), 'c', 54, 4, '#fff078', '#ff9628'); txt(Wd.place, 'c', 96, 2, '#ffffff', '#bedcff'); txt(Wd.mission, 'c', 126, 1, '#ff8cbe');
  ['JAPAN','EGYPT','PARIS','CAKE'].forEach((n,i) => { const x=40+i*64; ctx.fillStyle = i<S.wi ? '#82eb6e' : i===S.wi ? '#ffc83c' : '#4a3a6a'; ctx.beginPath(); ctx.arc(x,150,5,0,7); ctx.fill(); if (i<3){ ctx.fillStyle='#ffffff55'; for (let k=1;k<8;k++) ctx.fillRect(x+k*8-2,149,3,2); } });
  const st=heroStrip(); st && frameDraw(st, (frame>>3)%2?1:2, 80, 92, 60, GY-88);
  S.fol.forEach((f,i) => drawFollower({k:f.k, x:30-i*26+40, y:GY, face:1}, 0, 'run'));
  if (S.t>40 && (frame>>4)%2) txt('TAP TO GO!', 'c', 196, 2, '#ffffff'); }
function drawFinale(){
  ctx.drawImage(IMG.bg_night,0,0);
  for (const q of S.fw){ const r=q.t*.7, a=1-q.t/70; ctx.globalAlpha=a; ctx.fillStyle=q.c; for (let k=0;k<20;k++){ const an=k/20*6.283; ctx.fillRect(Math.round(q.x+Math.cos(an)*r), Math.round(q.y+Math.sin(an)*r+(q.t/70)**2*10), 2, 2); } ctx.globalAlpha=1; }
  const beat=(S.t>>4)%2;
  drawFollower({k:'siddhay',x:22,y:GY - (beat?2:0),face:1},0,beat?'dance':'dance2');
  drawFollower({k:'chow',x:64,y:GY - (beat?0:2),face:1},0,beat?'dance2':'dance');
  drawHero(110, GY-(beat?3:0), beat?'dance':'dance2', false);
  drawFollower({k:'sanvi',x:154,y:GY - (beat?0:3),face:-1},0,beat?'dance2':'dance');
  ctx.fillStyle='rgba(255,240,180,.18)'; ctx.beginPath(); ctx.arc(204,GY-20,26,0,7); ctx.fill(); spr('cake',178,GY-46);
  drawFollower({k:'tintin',x:248,y:GY,face:-1},0,'dance');
  drawParts(0);
  if (S.t>40){ const y=Math.min(22,-130+(S.t-40)*3); banner(y,120); txt('HAPPY','c',y+10,5,'#fff582','#ff7828'); txt('BIRTHDAY','c',y+52,3,'#ffffff','#bedcff'); txt(N()+'!','c',y+82,N().length>8?2:3,'#ffaad2','#ff468c');
    txt('FROM SIDDHAY, CHOW, SANVI & TINTIN *', 'c', y+108, 1, '#ffd2e6'); }
  if (S.t>480 && (frame>>5)%2) txt('TAP TO PLAY AGAIN','c',158,1,'#ffffff');
}

function drawPad(){
  const y0=VH, g=ctx.createLinearGradient(0,y0,0,H); g.addColorStop(0,'#2c1b4a'); g.addColorStop(1,'#150d26'); ctx.fillStyle=g; ctx.fillRect(0,y0,W,H-y0);
  ctx.fillStyle='#ffc83c'; ctx.fillRect(0,y0,W,2); ctx.fillStyle='#ff5a8c'; ctx.fillRect(0,y0+3,W,1);
  txt('BIRTHDAY QUEST','c',y0+9,1,'#7a64a8');
  for (let i=0;i<4;i++){ ctx.fillStyle='#3a2860'; ctx.save(); ctx.translate(232+i*7,462); ctx.rotate(-.5); ctx.fillRect(0,-9,3,18); ctx.restore(); }
  const {x,y}=DP, a=15, L=44;
  ctx.fillStyle='#0c0818'; ctx.beginPath(); ctx.arc(x,y,50,0,7); ctx.fill(); ctx.fillStyle='#463470'; ctx.beginPath(); ctx.arc(x,y,47,0,7); ctx.fill();
  const part=(on,rx,ry,rw,rh) => { ctx.fillStyle=on?'#ff6ea0':'#2a2a3c'; ctx.fillRect(rx,ry,rw,rh); };
  ctx.fillStyle='#12101c'; ctx.fillRect(x-a-2,y-L/2-16,2*a+4,L+36); ctx.fillRect(x-L/2-18,y-a-2,L+36,2*a+4);
  part(0,x-a,y-a,2*a,2*a); part(IN.up,x-a,y-L/2-14,2*a,L/2+14-a); part(0,x-a,y+a,2*a,L/2+14-a); part(IN.left,x-L/2-16,y-a,L/2+16-a,2*a); part(IN.right,x+a,y-a,L/2+16-a,2*a);
  const arrow=(cx,cy,d) => { ctx.fillStyle='#9a90c0'; ctx.beginPath();
    if(d==='u'){ctx.moveTo(cx,cy-4);ctx.lineTo(cx-5,cy+3);ctx.lineTo(cx+5,cy+3);} if(d==='l'){ctx.moveTo(cx-4,cy);ctx.lineTo(cx+3,cy-5);ctx.lineTo(cx+3,cy+5);}
    if(d==='r'){ctx.moveTo(cx+4,cy);ctx.lineTo(cx-3,cy-5);ctx.lineTo(cx-3,cy+5);} if(d==='d'){ctx.moveTo(cx,cy+4);ctx.lineTo(cx-5,cy-3);ctx.lineTo(cx+5,cy-3);} ctx.fill(); };
  arrow(x,y-a-12,'u'); arrow(x-a-12,y,'l'); arrow(x+a+12,y,'r'); arrow(x,y+a+12,'d');
  txt('AIM UP',x-17,y-L/2-28,1,'#7a64a8');
  for (const [k,b,col,dark] of [['jump',BTN.A,'#ff4f7a','#a01e46'],['fire',BTN.B,'#ffc83c','#b07814']]){ const on=IN[k];
    ctx.fillStyle='#0c0818'; ctx.beginPath(); ctx.arc(b.x+1,b.y+3,b.r+3,0,7); ctx.fill(); ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(b.x,b.y+(on?2:3),b.r,0,7); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(b.x,b.y+(on?2:0),b.r-(on?1:0),0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(b.x-7,b.y-8+(on?2:0),6,0,7); ctx.fill();
    txt(k==='jump'?'A':'B', b.x-5, b.y-8+(on?2:0), 2, '#ffffff', '#ffffff', dark); txt(b.label, b.x-(b.label.length*6-1)/2-2, b.y+b.r+4, 1, '#c8b8f0'); }
}

function draw(){
  ctx.save(); if (S.shake>.5) ctx.translate(Math.round((Math.random()-.5)*S.shake), Math.round((Math.random()-.5)*S.shake));
  ctx.beginPath(); ctx.rect(0,0,W,VH); ctx.clip();
  switch (S.mode){
    case 'title': drawTitle(); break; case 'creator': drawCreator(); break; case 'story': drawStory(); break; case 'rules': drawRules(); break;
    case 'card': drawCard(); break;
    case 'level': case 'bossIntro': case 'boss': case 'rescue': drawLevel(); drawHUD(); if (S.mode==='level' && S.t<100) txt(WD().place, 'c', 40, 2, '#ffffff', '#ffd2e6'); break;
    case 'finalIntro': case 'final': drawFinalArena(); drawHUD(); if (S.mode==='final' && S.t<100) txt('HOLD B TO BLAST!','c',196,1,'#ffffff'); break;
    case 'clear': drawFinalArena(); { const c=S.cake; ctx.fillStyle='rgba(255,240,180,.25)'; ctx.beginPath(); ctx.arc(c.x,c.y+22,34,0,7); ctx.fill(); spr('cake',c.x-26,c.y); }
      drawHUD(); banner(40,92); txt('YOU GOT','c',50,3,'#fff582','#ff7828'); txt('THE CAKE!','c',80,4,'#fff582','#ff7828'); txt('SCORE '+S.score,'c',146,2,'#ffffff','#bedcff'); break;
    case 'finale': drawFinale(); break;
  }
  drawBarks();
  drawDialog();
  if (S.cont>0){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,VH); txt('CONTINUE?','c',120,3,'#ffffff'); if (S.cont<70) txt('YES!','c',160,3,'#ffe65a','#ff9628'); }
  if (S.msg && (S.msg.t>30||(frame>>2)%2)) txt(S.msg.s,'c',60,2,'#fff078','#ff78be');
  if (S.fade>0){ ctx.fillStyle=`rgba(0,0,0,${S.fade/14})`; ctx.fillRect(0,0,W,VH); }
  ctx.fillStyle='rgba(0,0,0,.08)'; for (let y=0;y<VH;y+=2) ctx.fillRect(0,y,W,1);
  ctx.restore(); drawPad();
  if (loaded<AK.length){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); txt('LOADING...','c',230,2,'#ffffff'); }
}

let acc=0, lastT=performance.now();
function loop(t){ acc+=Math.min(100,t-lastT); lastT=t; while(acc>=1000/60){ if (loaded>=AK.length) update(); acc-=1000/60; } musicTick(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });
</script>
</body>
